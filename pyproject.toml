[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "huntersec"
version = "0.1.0"
description = "Autonomous offensive-security agent — ethical, opensource, multi-LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "plastma65", email = "plastma65@gmail.com" },
]
keywords = ["security", "pentest", "red-team", "ctf", "ai-agent", "llm", "langgraph"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM providers
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "ollama>=0.3.0",
    # Core
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.8.0",
    # Sandbox
    "docker>=7.1.0",
    "aiofiles>=24.1.0",
    # Storage
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    # Reports
    "jinja2>=3.1.0",
    "markdown-it-py>=3.0.0",
    # Misc
    "pyyaml>=6.0.0",
    "keyring>=25.0.0",
    "blake3>=0.4.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "pytest-recording>=0.13.0",
    "hypothesis>=6.110.0",
    "syrupy>=4.7.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.0",
    "semgrep>=1.85.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.8.0",
    "types-PyYAML",
    "types-requests",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[project.scripts]
hunter = "huntersec.cli.main:app"

[project.urls]
Homepage = "https://github.com/plastma65/HunterSecV1"
Documentation = "https://plastma65.github.io/HunterSecV1/"
Repository = "https://github.com/plastma65/HunterSecV1.git"
Issues = "https://github.com/plastma65/HunterSecV1/issues"
Changelog = "https://github.com/plastma65/HunterSecV1/blob/main/CHANGELOG.md"

# ─────────────────────────────────────────────────────────────────────────────
# Hatch
# ─────────────────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/huntersec"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "ASYNC",# flake8-async
    "DTZ",  # flake8-datetimez
    "G",    # flake8-logging-format
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
    "D",    # pydocstyle (Google convention)
]
ignore = [
    "D100",  # missing module docstring (allowed for tests)
    "D104",  # missing package docstring
    "D107",  # missing docstring in __init__ (Args documented in class docstring per Google style)
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — sometimes necessary in adapters
    "TRY003",  # long messages in raise — common in our exceptions
    "TRY300",  # consider-else — explicit flow is clearer in node functions
    "TRY301",  # abstract-raise — inline raises are fine in our retry loops
    "TRY004",  # type-check-without-type-error — ValueError is correct for bad LLM output
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "PLR2004", "PLC0415", "BLE001"]
"src/huntersec/**/__init__.py" = ["F401"]
"src/huntersec/cli/**/*.py" = ["B008", "PLC0415"]
"src/huntersec/llm/anthropic.py" = ["PLC0415"]
"src/huntersec/llm/openai_provider.py" = ["PLC0415"]
"src/huntersec/tools/registry.py" = ["PLC0415"]
"src/huntersec/core/session.py" = ["PLC0415"]
"src/huntersec/solvers/htb/solver.py" = ["PLC0415"]
"src/huntersec/memory/knowledge.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["huntersec"]
combine-as-imports = true

# ─────────────────────────────────────────────────────────────────────────────
# Black
# ─────────────────────────────────────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "docker.*",
    "sqlite_vec.*",
    "sentence_transformers.*",
    "ollama.*",
]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--timeout=30",
    "--cov=src/huntersec",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (fast, no external deps)",
    "integration: requires Docker / local services",
    "e2e: full end-to-end, may hit external lab targets",
    "slow: long-running tests",
    "llm: requires real LLM API (skipped by default)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:docker.*",
    "ignore::PendingDeprecationWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/huntersec"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# Module-level minimum coverage (enforced by CI script)
# safety:   95
# llm:      90
# sandbox:  85
# tools:    70
# overall:  80

# ─────────────────────────────────────────────────────────────────────────────
# Bandit
# ─────────────────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B108"]  # B101: assert_used; B108: /tmp in Docker tmpfs args (hardened)

[tool.bandit.assert_used]
exclude = ["*/tests/*"]
