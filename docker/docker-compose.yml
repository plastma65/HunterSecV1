version: "3.9"

# HunterSecV1 Docker Compose
# Usage:
#   docker compose up huntersec-agent
#   docker compose run --rm huntersec-agent hunter version
#
# Set HUNTERSEC_ANTHROPIC_API_KEY (or other provider key) in the environment
# before running.

services:
  huntersec-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kali
    image: huntersec/kali:latest
    container_name: huntersec-agent
    networks:
      - huntersec-net
    volumes:
      # Mount configs read-only; data dir is writable for audit logs
      - ../configs:/app/configs:ro
      - ../data:/app/data:rw
    environment:
      - HUNTERSEC_SAFETY_SCOPE_FILE=/app/configs/scope.yaml
      - HUNTERSEC_SAFETY_BLOCKLIST_FILE=/app/configs/blocklist.yaml
      - HUNTERSEC_SAFETY_AUDIT_LOG_DIR=/app/data/audit
      # Pass API keys from host environment (never hard-code)
      - HUNTERSEC_ANTHROPIC_API_KEY
      - HUNTERSEC_OPENAI_API_KEY
    # Resource constraints (defence-in-depth on top of SandboxSettings)
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    # Container security hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m

networks:
  huntersec-net:
    driver: bridge
    # internal: true for recon-only mode (no outbound internet from container)
    # Remove the comment below to enable isolation:
    # internal: true
    ipam:
      config:
        - subnet: "172.28.0.0/24"
