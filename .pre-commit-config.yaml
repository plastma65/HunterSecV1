repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - types-PyYAML
          - types-requests
        args: ["--config-file=pyproject.toml"]
        files: ^src/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.secrets\.baseline|tests/fixtures/.*)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  - repo: local
    hooks:
      - id: check-claude-md-not-empty
        name: Check CLAUDE.md not empty
        entry: bash -c 'test -s CLAUDE.md || (echo "CLAUDE.md must not be empty" && exit 1)'
        language: system
        pass_filenames: false

      - id: forbid-shell-true
        name: Forbid subprocess shell=True
        entry: bash -c 'if grep -rn "shell=True" src/ --include="*.py" | grep -v "# SAFETY:"; then echo "subprocess shell=True forbidden without # SAFETY: comment"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: forbid-eval-exec
        name: Forbid eval/exec on dynamic content
        entry: bash -c 'if grep -rEn "\\beval\\(|\\bexec\\(" src/ --include="*.py" | grep -v "# SAFETY:"; then echo "eval/exec forbidden without # SAFETY: comment"; exit 1; fi'
        language: system
        pass_filenames: false
